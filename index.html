<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Purnama Cilewo Cup 2026 — Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#070f24;
  --navy-900:#0a1730;
  --navy-800:#11224a;
  --navy-700:#1a3164;
  --navy-600:#254480;
  --line:rgba(232,185,63,0.16);
  --gold-500:#e8b93f;
  --gold-400:#f2ce6c;
  --gold-dim:rgba(232,185,63,0.14);
  --green-500:#39a866;
  --green-dim:rgba(57,168,102,0.16);
  --red-500:#e0524b;
  --red-dim:rgba(224,82,75,0.16);
  --blue-500:#3f7ee8;
  --ink:#eef2fb;
  --ink-dim:#9fb0d1;
  --ink-faint:#6d7fa3;
  --card:#0e1c3d;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--navy-950);
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,185,63,0.10), transparent 60%),
    radial-gradient(ellipse 700px 400px at 100% 100%, rgba(63,126,232,0.08), transparent 60%);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.01em;}
#shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--navy-900);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,0.5);
}
@media(min-width:481px){
  body{padding:24px 0;}
  #shell{border-radius:22px;overflow:hidden;min-height:calc(100vh - 48px);}
}

/* ---------- HEADER ---------- */
#topbar{
  background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:40;
}
#topbar img{width:40px;height:40px;border-radius:8px;flex-shrink:0;}
#topbar .titles{flex:1;min-width:0;}
#topbar .titles .t1{font-size:15px;font-weight:700;line-height:1.15;color:var(--gold-400);}
#topbar .titles .t2{font-size:10.5px;color:var(--ink-dim);letter-spacing:0.04em;margin-top:1px;}
#menuBtn{
  background:var(--navy-700);border:1px solid var(--line);color:var(--ink);
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
#menuBtn svg{width:18px;height:18px;}

/* ---------- CONTENT ---------- */
#content{flex:1;padding:14px 14px 90px 14px;overflow-y:auto;}
.section-title{
  font-size:13px;text-transform:none;color:var(--ink-dim);font-weight:600;
  margin:18px 0 8px 2px;display:flex;align-items:center;justify-content:space-between;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:10px;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
}
.pill.live{background:var(--red-dim);color:#ff8f88;}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red-500);animation:pulse 1.4s infinite;}
.pill.done{background:var(--green-dim);color:#7fe0a3;}
.pill.sched{background:var(--navy-700);color:var(--ink-dim);}
.pill.postponed{background:var(--gold-dim);color:var(--gold-400);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;}
.kpi .num{font-family:'Rajdhani';font-size:22px;font-weight:700;color:var(--gold-400);}
.kpi .lbl{font-size:10px;color:var(--ink-dim);margin-top:2px;}

/* Match row */
.match-row{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.match-row:last-child{border-bottom:none;}
.match-row .teams{flex:1;min-width:0;}
.match-row .tname{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-row .vs{font-size:10.5px;color:var(--ink-faint);margin:1px 0;}
.match-row .score{font-family:'Rajdhani';font-size:20px;font-weight:700;color:var(--gold-400);min-width:52px;text-align:center;}
.match-row .meta{font-size:10px;color:var(--ink-faint);text-align:right;min-width:56px;}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tab{
  padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:var(--navy-700);color:var(--ink-dim);cursor:pointer;border:1px solid transparent;
}
.tab.active{background:var(--gold-dim);color:var(--gold-400);border-color:var(--line);}

/* Standings table */
table.standings{width:100%;border-collapse:collapse;font-size:12.5px;}
table.standings th{
  text-align:center;color:var(--ink-faint);font-weight:600;font-size:10.5px;
  padding:6px 3px;border-bottom:1px solid var(--line);
}
table.standings th:first-child, table.standings td:first-child{text-align:left;padding-left:4px;}
table.standings td{padding:8px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04);}
table.standings tr.q-auto td:first-child{border-left:3px solid var(--green-500);padding-left:5px;}
table.standings tr.q-third td:first-child{border-left:3px solid var(--gold-500);padding-left:5px;}
table.standings tr.q-out td:first-child{border-left:3px solid transparent;}
table.standings .rt-name{font-weight:600;}
table.standings .pts{font-weight:700;color:var(--gold-400);}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink-faint);margin-top:8px;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:11px;font-weight:600;font-size:13.5px;
  border:1px solid transparent;cursor:pointer;font-family:'Inter';
}
.btn-gold{background:var(--gold-500);color:#26200a;}
.btn-green{background:var(--green-500);color:#08210f;}
.btn-red{background:var(--red-500);color:#2a0805;}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-ghost{background:var(--navy-700);color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:9px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* Forms */
label{font-size:11.5px;color:var(--ink-dim);display:block;margin-bottom:4px;font-weight:600;}
input,select,textarea{
  width:100%;background:var(--navy-800);border:1px solid var(--line);color:var(--ink);
  padding:10px 11px;border-radius:9px;font-size:13.5px;font-family:'Inter';margin-bottom:12px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-500);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* Bottom nav */
#bottomnav{
  position:sticky;bottom:0;left:0;right:0;
  background:var(--navy-800);border-top:1px solid var(--line);
  display:flex;z-index:40;
}
.navitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 0 8px 0;color:var(--ink-faint);cursor:pointer;
}
.navitem svg{width:20px;height:20px;}
.navitem span{font-size:9.5px;font-weight:600;}
.navitem.active{color:var(--gold-400);}

/* Modal / drawer */
.overlay{
  position:fixed;inset:0;background:rgba(4,8,20,0.72);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:481px){.overlay{align-items:center;}}
.sheet{
  background:var(--navy-900);border:1px solid var(--line);
  border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  padding:18px 16px 24px 16px;animation:slideup 0.18s ease-out;
}
@media(min-width:481px){.sheet{border-radius:18px;}}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{margin:0;font-size:17px;}
.closeX{width:30px;height:30px;border-radius:8px;background:var(--navy-700);border:none;color:var(--ink);cursor:pointer;font-size:16px;}

.drawer-menu-item{
  display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:14px;font-weight:600;
}
.drawer-menu-item svg{width:18px;height:18px;color:var(--gold-400);}
.muted{color:var(--ink-faint);font-size:12px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--ink-faint);font-size:13px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.badge-admin{background:var(--gold-dim);color:var(--gold-400);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.event-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.event-item:last-child{border-bottom:none;}
.event-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.event-icon.goal{background:var(--green-dim);}
.event-icon.yellow{background:#e8b93f22;}
.event-icon.red{background:var(--red-dim);}
.event-item .meta-txt{flex:1;}
.event-item .del{color:var(--ink-faint);cursor:pointer;font-size:12px;padding:4px 8px;}
.scorebig{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 0 6px 0;}
.scorebig .teamblock{flex:1;text-align:center;}
.scorebig .teamblock .nm{font-size:13px;font-weight:600;min-height:32px;display:flex;align-items:center;justify-content:center;}
.scorebig .sc{font-family:'Rajdhani';font-size:44px;font-weight:700;color:var(--gold-400);}
.scorebig .colon{font-size:24px;color:var(--ink-faint);align-self:center;margin-top:20px;}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--navy-700);border:1px solid var(--gold-500);color:var(--ink);
  padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;
  animation:toastin 0.2s ease-out;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:150px;}
.bracket-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.bracket-match{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;min-width:140px;}
.bracket-match .bm-team{display:flex;justify-content:space-between;padding:3px 0;}
.bracket-match .bm-team.winner{color:var(--gold-400);font-weight:700;}
.bracket-stage-label{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-bottom:6px;font-weight:600;}
.hint{font-size:11px;color:var(--ink-faint);margin:-6px 0 12px 2px;}
.link{color:var(--gold-400);cursor:pointer;text-decoration:underline;font-weight:600;}
.team-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.team-row:last-child{border-bottom:none;}
.chip-group{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.group-A{background:#3f7ee822;color:#7fa8ef;}
.group-B{background:#39a86622;color:#7fe0a3;}
.group-C{background:#e8b93f22;color:var(--gold-400);}
.iconbtn{background:var(--navy-700);border:1px solid var(--line);color:var(--ink);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;}
</style>
</head>

function roundRobinRounds(ids){
  let arr = ids.slice();
  if(arr.length % 2 !== 0) arr.push(null);
  const n = arr.length;
  const rounds = [];
  for(let r=0;r<n-1;r++){
    const pairs = [];
    for(let i=0;i<n/2;i++){
      const t1 = arr[i], t2 = arr[n-1-i];
      if(t1!==null && t2!==null) pairs.push(r%2===0?[t1,t2]:[t2,t1]);
    }
    rounds.push(pairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  return rounds;
}

function generateGroupSchedule(teams, startDateStr){
  const groups = {A:[],B:[],C:[]};
  teams.forEach(t=>groups[t.group].push(t.id));
  const roundsByGroup = {};
  Object.keys(groups).forEach(g=> roundsByGroup[g] = roundRobinRounds(groups[g]));
  const matches = [];
  const timeSlots = ['07:30','09:00','10:30','13:00','14:30','16:00'];
  const start = new Date(startDateStr+'T00:00:00');
  for(let week=0; week<5; week++){
    let slotIdx = 0;
    const d = new Date(start); d.setDate(d.getDate() + week*7);
    const dateStr = d.toISOString().slice(0,10);
    ['A','B','C'].forEach(g=>{
      (roundsByGroup[g][week]||[]).forEach(pair=>{
        matches.push({
          id: uid('m'),
          week: week+1,
          date: dateStr,
          time: timeSlots[slotIdx++ % timeSlots.length],
          stage:'GROUP',
          round:null,
          group: g,
          home: pair[0],
          away: pair[1],
          status:'SCHEDULED',
          note:''
        });
      });
    });
  }
  return matches;
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){

  }catch(e){ /* not found or error -> fall through to default */ }

/* ---------- STANDINGS LOGIC ---------- */
function isGroupComplete(g){
  return STATE.matches.filter(m=>m.group===g && m.stage==='GROUP').every(m=>m.status==='FINISHED');
}
function allGroupsComplete(){ return ['A','B','C'].every(isGroupComplete); }

function computeGroupTable(g){
  const teams = STATE.teams.filter(t=>t.group===g);
  const table = teams.map(t=>({id:t.id,name:t.name,rt:t.rt,mp:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,yellow:0,red:0}));
  const byId = Object.fromEntries(table.map(t=>[t.id,t]));
  const gMatches = STATE.matches.filter(m=>m.group===g && m.stage==='GROUP' && m.status==='FINISHED');
  gMatches.forEach(m=>{
    const sc = scoreOfMatch(m);
    const h = byId[m.home], a = byId[m.away];
    if(!h||!a) return;
    h.mp++; a.mp++;
    h.gf+=sc.h; h.ga+=sc.a;
    a.gf+=sc.a; a.ga+=sc.h;
    if(sc.h>sc.a){h.w++;h.pts+=3;a.l++;}
    else if(sc.h<sc.a){a.w++;a.pts+=3;h.l++;}
    else {h.d++;a.d++;h.pts+=1;a.pts+=1;}
  });
  table.forEach(t=>t.gd = t.gf - t.ga);
  STATE.events.forEach(e=>{
    const m = matchById(e.matchId);
    if(!m || m.status!=='FINISHED' || m.group!==g || m.stage!=='GROUP') return;
    const t = byId[e.teamId]; if(!t) return;
    if(e.type==='YELLOW_CARD') t.yellow++;
    if(e.type==='RED_CARD') t.red++;
  });

  const override = STATE.settings.manualOverride[g];
  if(override && override.order && override.order.length===table.length){
    table.sort((a,b)=> override.order.indexOf(a.id) - override.order.indexOf(b.id));
  } else {
    table.sort((a,b)=> compareTeams(a,b,gMatches));
  }
  return table;
}
function compareTeams(a,b,matches){
  if(b.pts!==a.pts) return b.pts-a.pts;
  if(b.gd!==a.gd) return b.gd-a.gd;
  if(b.gf!==a.gf) return b.gf-a.gf;
  const h2h = (matches||STATE.matches).find(m=>m.status==='FINISHED' && ((m.home===a.id&&m.away===b.id)||(m.home===b.id&&m.away===a.id)));
  if(h2h){
    const sc = scoreOfMatch(h2h);
    const aScore = h2h.home===a.id? sc.h : sc.a;
    const bScore = h2h.home===a.id? sc.a : sc.h;
    if(aScore!==bScore) return bScore-aScore;
  }
  const aFair = a.yellow + a.red*2, bFair = b.yellow + b.red*2;
  if(aFair!==bFair) return aFair-bFair;
  return a.name.localeCompare(b.name);
}
function bestThirdTable(){
  const thirds = ['A','B','C'].map(g=>{
    const t = computeGroupTable(g);
    return t[2] ? {...t[2], group:g} : null;
  }).filter(Boolean);
  thirds.sort((a,b)=> compareTeams(a,b,[]));
  return thirds;
}
function qualifiedEight(){
  if(!allGroupsComplete()) return null;
  const list = [];
  ['A','B','C'].forEach(g=>{
    const t = computeGroupTable(g);
    list.push({...t[0], group:g, seed:'Juara '+g});
    list.push({...t[1], group:g, seed:'Runner-up '+g});
  });
  const thirds = bestThirdTable().slice(0,2);
  thirds.forEach(t=> list.push({...t, seed:'3 Terbaik'}));
  return list;
}

function validateSchedule(){
  let issues = [];
  ['A','B','C'].forEach(g=>{
    const ms = STATE.matches.filter(m=>m.group===g && m.stage==='GROUP');
    if(ms.length!==10) issues.push('Grup '+g+' tidak memiliki tepat 10 pertandingan (ada '+ms.length+').');
    const seen = new Set(); let dup=false;
    ms.forEach(m=>{ const key=[m.home,m.away].sort().join('-'); if(seen.has(key)) dup=true; seen.add(key); });
    if(dup) issues.push('Grup '+g+' memiliki pasangan tim yang duplikat.');
    const counts = {};
    ms.forEach(m=>{ counts[m.home]=(counts[m.home]||0)+1; counts[m.away]=(counts[m.away]||0)+1; });
    Object.entries(counts).forEach(([tid,c])=>{ if(c!==4) issues.push(teamName(tid)+' bermain '+c+' kali (harus 4).'); });
  });
  showModal(`
    <div class="sheet-head"><h3>Hasil Validasi</h3><button class="closeX" onclick="closeModal()">✕</button></div>
    ${issues.length? `<div class="card" style="border-color:var(--red-500);">${issues.map(i=>'⚠ '+i).join('<br>')}</div>` : `<div class="card" style="border-color:var(--green-500);">✓ Jadwal valid: setiap grup memiliki 10 pertandingan unik, setiap tim bermain 4 kali.</div>`}
  `);
}

/* ---------- PERTANDINGAN (list) ---------- */
function renderPertandingan(){
  const order = {LIVE:0,SCHEDULED:1,POSTPONED:2,FINISHED:3,CANCELLED:4};
  const list = [...STATE.matches].sort((a,b)=>{
    if(order[a.status]!==order[b.status]) return order[a.status]-order[b.status];
    return (a.date+a.time).localeCompare(b.date+b.time);
  });
  let html = `<div class="section-title">Semua Pertandingan</div><div class="card">`;
  html += list.map(m=>`${matchRowHtml(m)}<div style="text-align:right;font-size:10px;color:var(--ink-faint);margin:-6px 0 4px 0;">${m.stage==='GROUP'?'Grup '+m.group+' · Pekan '+m.week : (m.round||m.stage)}</div>`).join('');
  html += `</div>`;
  return html;
}

      <label style="margin-top:6px;"><input type="checkbox" id="tpm" style="width:auto;display:inline-block;margin-right:6px;" ${STATE.settings.thirdPlaceMatch?'checked':''}> Sertakan pertandingan perebutan juara 3</label>

function randomDraw(){
  const q = qualifiedEight().map(t=>t.id);
  const shuffled = [...q].sort(()=>Math.random()-0.5);
  SUBSTATE.qfDraft = [[shuffled[0],shuffled[1]],[shuffled[2],shuffled[3]],[shuffled[4],shuffled[5]],[shuffled[6],shuffled[7]]];
  render();
  go('klasemen',{kTab:'BAGAN', qfDraft:SUBSTATE.qfDraft});
}
async function lockKnockout(){
  const pairs = [0,1,2,3].map(i=>[document.getElementById('qf'+i+'a').value, document.getElementById('qf'+i+'b').value]);
  const flat = pairs.flat();
  if(new Set(flat).size !== 8){ toast('Setiap tim hanya boleh muncul sekali'); return; }
  const tpm = document.getElementById('tpm').checked;
  await mutate(s=>{
    s.settings.thirdPlaceMatch = tpm;
    s.knockout.pairsLocked = true;
    s.knockout.qfPairs = pairs;
    const base = new Date(s.settings.startDate); base.setDate(base.getDate()+35);
    pairs.forEach((p,i)=>{
      s.matches.push({id:uid('m'),week:null,date:base.toISOString().slice(0,10),time:['13:00','14:30','16:00','17:30'][i],stage:'KO',round:'Perempat Final',group:null,home:p[0],away:p[1],status:'SCHEDULED',note:''});
    });
  });
  toast('Pasangan perempat final dikunci');
  render();
}
function koMatchesByRound(round){
  return STATE.matches.filter(m=>m.stage==='KO' && m.round===round);
}
function renderBracketColumns(){
  let html = `<div class="bracket-wrap">`;
  ['Perempat Final','Semifinal','Final'].forEach(round=>{
    const ms = koMatchesByRound(round);
    html += `<div class="bracket-col"><div class="bracket-stage-label">${round}</div>`;
    if(!ms.length){
      html += `<div class="muted" style="font-size:11px;text-align:center;">Belum tersedia</div>`;
    } else {
      ms.forEach(m=>{
        const sc = scoreOfMatch(m);
        const winner = matchWinner(m);
        html += `<div class="bracket-match" onclick="go('matchdetail',{matchId:'${m.id}'})" style="cursor:pointer;">
          <div class="bm-team ${winner===m.home?'winner':''}"><span>${teamName(m.home)}</span><span>${m.status!=='SCHEDULED'?sc.h:''}</span></div>
          <div class="bm-team ${winner===m.away?'winner':''}"><span>${teamName(m.away)}</span><span>${m.status!=='SCHEDULED'?sc.a:''}</span></div>
        </div>`;
      });
    }
    html += `</div>`;
  });
  html += `</div>`;

  const qf = koMatchesByRound('Perempat Final');
  const qfDone = qf.length===4 && qf.every(m=>m.status==='FINISHED');
  const sf = koMatchesByRound('Semifinal');
  if(IS_ADMIN && qfDone && !sf.length){
    html += `<div class="card"><button class="btn btn-gold btn-block" onclick="generateSemifinal()">Buat Jadwal Semifinal</button></div>`;
  }
  const sfDone = sf.length===2 && sf.every(m=>m.status==='FINISHED');
  const fin = koMatchesByRound('Final');
  if(IS_ADMIN && sfDone && !fin.length){
    html += `<div class="card"><button class="btn btn-gold btn-block" onclick="generateFinal()">Buat Jadwal Final${STATE.settings.thirdPlaceMatch?' & Perebutan Juara 3':''}</button></div>`;
  }
  const finDone = fin.length && fin.every(m=>m.status==='FINISHED');
  if(finDone){
    const champ = matchWinner(fin.find(m=>m.round==='Final'));
    html += `<div class="card" style="text-align:center;border-color:var(--gold-500);">
      <div class="muted">JUARA</div>
      <h2 style="color:var(--gold-400);margin:6px 0;">${teamName(champ)}</h2>
    </div>`;
  }
  return html;
}
function matchWinner(m){
  if(!m || m.status!=='FINISHED') return null;
  const sc = scoreOfMatch(m);
  if(m.koWinner) return m.koWinner;
  if(sc.h>sc.a) return m.home;
  if(sc.a>sc.h) return m.away;
  return null;
}
async function generateSemifinal(){
  const qf = koMatchesByRound('Perempat Final');
  const w = qf.map(matchWinner);
  await mutate(s=>{
    const base = new Date(); base.setDate(base.getDate()+7);
    const date = base.toISOString().slice(0,10);
    s.matches.push({id:uid('m'),week:null,date,time:'14:00',stage:'KO',round:'Semifinal',group:null,home:w[0],away:w[1],status:'SCHEDULED',note:''});
    s.matches.push({id:uid('m'),week:null,date,time:'16:00',stage:'KO',round:'Semifinal',group:null,home:w[2],away:w[3],status:'SCHEDULED',note:''});
  });
  toast('Jadwal semifinal dibuat');
}
async function generateFinal(){
  const sf = koMatchesByRound('Semifinal');
  const w = sf.map(matchWinner);
  const l = sf.map((m,i)=> matchWinner(m)===m.home ? m.away : m.home);
  await mutate(s=>{
    const base = new Date(); base.setDate(base.getDate()+7);
    const date = base.toISOString().slice(0,10);
    if(s.settings.thirdPlaceMatch){
      s.matches.push({id:uid('m'),week:null,date,time:'13:00',stage:'KO',round:'Perebutan Juara 3',group:null,home:l[0],away:l[1],status:'SCHEDULED',note:''});
    }
    s.matches.push({id:uid('m'),week:null,date,time:'15:30',stage:'KO',round:'Final',group:null,home:w[0],away:w[1],status:'SCHEDULED',note:''});
  });
  toast('Jadwal final dibuat');
}

/* ---------- STATISTIK ---------- */
function renderStatistik(){
  const tab = SUBSTATE.sTab || 'scorer';
  let html = `<div class="tabs">
    <div class="tab ${tab==='scorer'?'active':''}" onclick="SUBSTATE.sTab='scorer';render()">TOP SKORER</div>
    <div class="tab ${tab==='cards'?'active':''}" onclick="SUBSTATE.sTab='cards';render()">KARTU</div>
    <div class="tab ${tab==='gk'?'active':''}" onclick="SUBSTATE.sTab='gk';render()">DATA GK</div>
  </div>`;
  if(tab==='scorer'){
    html += `<div class="card">${topScorerListHtml()}</div>`;
  } else if(tab==='cards'){
    const counts = {};
    STATE.events.forEach(e=>{
      if(e.type!=='YELLOW_CARD' && e.type!=='RED_CARD') return;
      const m = matchById(e.matchId); if(!m || m.status!=='FINISHED') return;
      counts[e.playerId] = counts[e.playerId] || {y:0,r:0};
      if(e.type==='YELLOW_CARD') counts[e.playerId].y++; else counts[e.playerId].r++;
    });
    const rows = Object.entries(counts).sort((a,b)=>(b[1].y+b[1].r*2)-(a[1].y+a[1].r*2));
    html += `<div class="card">`;
    if(!rows.length) html += `<div class="empty-state">Belum ada kartu tercatat.</div>`;
    else html += `<table class="standings"><tr><th style="text-align:left;">Pemain</th><th>Tim</th><th>🟨</th><th>🟥</th></tr>
      ${rows.map(([pid,c])=>{ const p=STATE.players.find(pp=>pp.id===pid); if(!p) return ''; return `<tr><td style="text-align:left;">${p.name}</td><td>${teamName(p.teamId)}</td><td>${c.y}</td><td>${c.r}</td></tr>`; }).join('')}
      </table>`;
    html += `</div>`;
  } else {
    html += `<div class="card">`;
    const rows = STATE.teams.map(t=>{
      const ms = STATE.matches.filter(m=>(m.home===t.id||m.away===t.id) && m.status==='FINISHED');
      let mp=0, ga=0, cs=0;
      ms.forEach(m=>{
        const sc = scoreOfMatch(m);
        mp++;
        const conceded = m.home===t.id? sc.a : sc.h;
        ga += conceded;
        if(conceded===0) cs++;
      });
      return {name:t.name, mp, ga, cs};
    }).sort((a,b)=> a.ga-b.ga);
    html += `<table class="standings"><tr><th style="text-align:left;">Tim</th><th>Main</th><th>Kebobolan</th><th>Clean Sheet</th></tr>
      ${rows.map(r=>`<tr><td style="text-align:left;">${r.name}</td><td>${r.mp}</td><td>${r.ga}</td><td>${r.cs}</td></tr>`).join('')}
      </table>`;
    html += `</div><p class="hint">GK Terbaik tetap merupakan keputusan panitia berdasarkan data pendukung ini.</p>`;
  }
  return html;
}

/* ---------- ADMIN: TEAMS ---------- */
function renderAdminTeams(){
  if(!requireAdmin()) return adminLoginPrompt();
  let html = `<div class="section-title">Tim / RT <span class="link" style="font-size:11px;" onclick="openTeamModal()">+ Edit Tim</span></div>`;
  ['A','B','C'].forEach(g=>{
    html += `<div class="card">
      <div class="muted" style="margin-bottom:4px;font-weight:700;">GRUP ${g}</div>
      ${STATE.teams.filter(t=>t.group===g).map(t=>`
        <div class="team-row">
          <div class="chip-group group-${g}">${g}</div>
          <div style="flex:1;">
            <div style="font-weight:600;">${t.name}</div>
            <div class="muted">${t.manager? 'PJ: '+t.manager : 'Belum ada penanggung jawab'}</div>
          </div>
          <button class="iconbtn" onclick="openTeamModal('${t.id}')">✎</button>
        </div>`).join('')}
    </div>`;
  });
  return html;
}
function openTeamModal(teamId){
  const t = teamId ? teamById(teamId) : null;
  showModal(`
    <div class="sheet-head"><h3>${t?'Edit Tim':'Pilih Tim'}</h3><button class="closeX" onclick="closeModal()">✕</button></div>
    ${t ? `
      <label>Nama Tim</label><input id="tName" value="${t.name}">
      <label>Nama Penanggung Jawab (opsional)</label><input id="tManager" value="${t.manager||''}">
      <label>No. WhatsApp PJ (opsional)</label><input id="tWa" value="${t.managerWA||''}">
      <button class="btn btn-gold btn-block" onclick="saveTeam('${t.id}')">Simpan</button>
    ` : STATE.teams.map(tt=>`<div class="match-row" onclick="closeModal();openTeamModal('${tt.id}')"><div class="teams"><div class="tname">${tt.name}</div></div></div>`).join('')}
  `);
}
async function saveTeam(id){
  const name = document.getElementById('tName').value.trim();
  const manager = document.getElementById('tManager').value.trim();
  const managerWA = document.getElementById('tWa').value.trim();
  if(!name){ toast('Nama tim wajib diisi'); return; }
  await mutate(s=>{ const t=s.teams.find(x=>x.id===id); t.name=name; t.manager=manager; t.managerWA=managerWA; });
  closeModal();
  toast('Data tim disimpan');
}

/* ---------- ADMIN: PLAYERS ---------- */
function renderAdminPlayers(){
  if(!requireAdmin()) return adminLoginPrompt();
  const teamId = SUBSTATE.playerTeam || STATE.teams[0].id;
  let html = `<div class="tabs" style="overflow-x:auto;flex-wrap:nowrap;">
    ${STATE.teams.map(t=>`<div class="tab ${teamId===t.id?'active':''}" style="flex-shrink:0;" onclick="SUBSTATE.playerTeam='${t.id}';render()">${t.name}</div>`).join('')}
  </div>`;
  html += `<div class="card">
    <div class="btn-row" style="margin-bottom:10px;"><button class="btn btn-outline btn-sm" onclick="openPlayerModal('${teamId}')">+ Tambah Pemain</button></div>
    ${playersOfTeam(teamId).map(p=>`
      <div class="team-row">
        <div style="flex:1;"><div style="font-weight:600;">${p.name} ${p.number?'#'+p.number:''}</div><div class="muted">${p.position||'-'}</div></div>
        <button class="iconbtn" onclick="openPlayerModal('${teamId}','${p.id}')">✎</button>
      </div>`).join('')}
    ${!playersOfTeam(teamId).length? `<div class="empty-state">Belum ada pemain terdaftar.</div>`:''}
  </div>`;
  return html;
}
function openPlayerModal(teamId, playerId){
  const p = playerId ? STATE.players.find(x=>x.id===playerId) : null;
  showModal(`
    <div class="sheet-head"><h3>${p?'Edit Pemain':'Tambah Pemain'}</h3><button class="closeX" onclick="closeModal()">✕</button></div>
    <label>Nama Pemain</label><input id="pName" value="${p?p.name:''}">
    <div class="field-row">
      <div><label>No. Punggung</label><input id="pNumber" type="number" value="${p?p.number||'':''}"></div>
      <div><label>Posisi</label><select id="pPosition">
        ${['','GK','DF','MF','FW'].map(pos=>`<option value="${pos}" ${p&&p.position===pos?'selected':''}>${pos||'—'}</option>`).join('')}
      </select></div>
    </div>
    <button class="btn btn-gold btn-block" onclick="savePlayer('${teamId}','${playerId||''}')">Simpan</button>
    ${p? `<button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="deactivatePlayer('${p.id}')">Nonaktifkan Pemain</button>`:''}
  `);
}
async function savePlayer(teamId, playerId){
  const name = document.getElementById('pName').value.trim();
  const number = document.getElementById('pNumber').value.trim();
  const position = document.getElementById('pPosition').value;
  if(!name){ toast('Nama pemain wajib diisi'); return; }
  const dupNumber = STATE.players.find(p=>p.teamId===teamId && p.number===number && p.id!==playerId && number!=='');
  if(dupNumber){ toast('Nomor punggung sudah dipakai di tim ini'); return; }
  await mutate(s=>{
    if(playerId){
      const p = s.players.find(x=>x.id===playerId);
      p.name=name; p.number=number; p.position=position;
    } else {
      s.players.push({id:uid('p'),teamId,name,number,position,active:true});
    }
  });
  closeModal();
  toast('Data pemain disimpan');
}
async function deactivatePlayer(playerId){
  await mutate(s=>{ s.players.find(p=>p.id===playerId).active=false; });
  closeModal();
  toast('Pemain dinonaktifkan');
}

/* ---------- ADMIN: SETTINGS ---------- */
function renderAdminSettings(){
  if(!requireAdmin()) return adminLoginPrompt();
  return `
    <div class="section-title">Pengaturan Turnamen</div>
    <div class="card">
      <label>Nama Turnamen</label><input id="setName" value="${STATE.settings.tournamentName}">
      <button class="btn btn-outline btn-sm" onclick="saveTournamentName()">Simpan Nama</button>
    </div>
    <div class="card">
      <label>Ubah PIN Admin</label><input id="setPin" placeholder="PIN baru">
      <button class="btn btn-outline btn-sm" onclick="changePin()">Ubah PIN</button>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:8px;">Zona berbahaya</div>
      <button class="btn btn-red btn-block" onclick="confirmReset()">⚠ Reset Seluruh Data Turnamen</button>
    </div>
    <div class="card">
      <button class="btn btn-outline btn-block" onclick="doLogout()">Keluar dari Mode Admin</button>
    </div>
  `;
}
async function saveTournamentName(){
  const name = document.getElementById('setName').value.trim();
  if(!name) return;
  await mutate(s=>{ s.settings.tournamentName = name; });
  toast('Nama turnamen disimpan');
}
async function changePin(){
  const pin = document.getElementById('setPin').value.trim();
  if(!pin || pin.length<4){ toast('PIN minimal 4 digit'); return; }
  await mutate(s=>{ s.settings.adminPin = pin; });
  toast('PIN admin diperbarui');
}
function confirmReset(){
  showModal(`
    <div class="sheet-head"><h3>Reset Data?</h3><button class="closeX" onclick="closeModal()">✕</button></div>
    <p class="muted">Ini akan menghapus SEMUA data (tim kembali ke default, pemain, jadwal, hasil, kartu) dan tidak dapat dibatalkan.</p>
    <button class="btn btn-red btn-block" onclick="doReset()">Ya, Hapus Semua Data</button>
  `);
}
async function doReset(){
  STATE = buildDefaultState();
  await saveState();
  closeModal();
  toast('Data turnamen direset');
  go('dashboard');
}
function doLogout(){ IS_ADMIN=false; toast('Keluar dari mode admin'); go('dashboard'); }

/* ---------- ADMIN GATE ---------- */
function requireAdmin(){ return IS_ADMIN; }
function adminLoginPrompt(){
  return `<div class="card" style="text-align:center;padding:30px 14px;">
    ${svgIcon('lock')}
    <p class="muted" style="margin-top:10px;">Halaman ini khusus panitia.</p>
    <button class="btn btn-gold" onclick="openLogin()">Masuk sebagai Admin</button>
  </div>`;
}
function openLogin(){
  showModal(`
    <div class="sheet-head"><h3>Login Panitia</h3><button class="closeX" onclick="closeModal()">✕</button></div>
    <label>PIN Admin</label>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="Masukkan PIN">
    <button class="btn btn-gold btn-block" onclick="tryLogin()">Masuk</button>
  `);
}
function tryLogin(){
  const val = document.getElementById('pinInput').value;
  if(val === STATE.settings.adminPin){
    IS_ADMIN = true;
    closeModal();
    toast('Berhasil masuk sebagai admin');
    render();
  } else {
    toast('PIN salah');
  }
}

/* ---------- SIDE MENU ---------- */
function openMenu(){
  showModal(`
    <div class="sheet-head"><h3>Menu</h3><button class="closeX" onclick="closeModal()">✕</button></div>
    ${IS_ADMIN ? `
      <div class="drawer-menu-item" onclick="closeModal();go('admin-teams')">${svgIcon('users')} Kelola Tim</div>
      <div class="drawer-menu-item" onclick="closeModal();go('admin-players')">${svgIcon('player')} Kelola Pemain</div>
      <div class="drawer-menu-item" onclick="closeModal();go('admin-settings')">${svgIcon('settings')} Pengaturan</div>
      <div class="drawer-menu-item" onclick="doLogout();closeModal();">${svgIcon('login')} Keluar Admin</div>
    ` : `
      <div class="drawer-menu-item" onclick="closeModal();openLogin();">${svgIcon('login')} Masuk Panitia</div>
    `}
    <div class="divider"></div>
    <p class="muted" style="text-align:center;">Purnama Cilewo Cup 2026<br>Data tersimpan otomatis &amp; dibagikan ke semua pengunjung.</p>
  `, true);
}

/* ---------- MODAL ---------- */
function showModal(innerHtml, noSheetClass){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${innerHtml}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------- BOOT ---------- */
(async function boot(){
  await loadState();
  render();
})();
</script>
